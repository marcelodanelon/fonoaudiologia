server.port=${PORT:8080}

# PostgreSQL from Neon - DATABASE_URL contains user:pass@host/dbname
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME:fonoaudiologia}?sslmode=require
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP - minimal pool for free tier
spring.datasource.hikari.maximumPoolSize=2
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.connectionTimeout=30000

# Memory optimization
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FONO_SESSION

# GZip
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
